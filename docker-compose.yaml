version: "3.9"
services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  web:
    build:
      context: ./server
    container_name: flask-server
    ports:
      - "5000:5000"
    environment:
      - SESSION_TYPE=redis
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
